{{- /* us 首页分区标题：标题、一句说明，右侧可选的整表入口（只用于首页未列全的内容）。 */ -}}
{{- $data := .data -}}
{{- $id := .id -}}
<header class="guide-head">
  <div class="guide-head__text">
    <h2 id="{{ $id }}-title">{{ $data.title }}</h2>
    {{- with $data.desc }}<p class="guide-head__desc">{{ . }}</p>{{ end }}
  </div>
  {{- with $data.more }}
  <a class="guide-head__more" href="{{ partial "us/home/link.html" . }}"{{ with $.hreflang }} hreflang="{{ . }}"{{ end }}>
    <span>{{ .label }}</span>
    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
  </a>
  {{- end }}
</header>
