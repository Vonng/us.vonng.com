<section class="td-landing-section us-cards-section" id="{{ .id }}" aria-labelledby="{{ .id }}-title"><div class="td-site-container"><h2 id="{{ .id }}-title">{{ .data.title }}</h2><p>{{ .data.desc }}</p><div class="us-card-grid">{{ range .data.items }}{{ $icon := .icon }}{{ with site.GetPage .page }}<a class="us-card" href="{{ .RelPermalink }}"><h3><i class="{{ $icon }}" aria-hidden="true"></i> {{ .Title }}</h3><p>{{ .Description }}</p><span aria-hidden="true">→</span></a>{{ end }}{{ end }}</div></div></section>
