title: 美利坚生活指南
baseURL: https://us.vonng.com/
theme: oink
defaultContentLanguage: zh
hasCJKLanguage: true
timeZone: America/New_York
enableRobotsTXT: true
enableGitInfo: false
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    params:
      description: 理解美国社会，处理日常生活中的具体问题。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
  highlight:
    noClasses: false
outputs:
  home:
  - HTML
  - markdown
  - LLMS
  - NAVJSON
  page:
  - HTML
  - markdown
  section:
  - HTML
  - markdown
taxonomies: {}
params:
  logo: favicon.svg
  offline_search: true
  offline_search_index: content
  copyright:
    authors: 美利坚生活指南编写组
    from_year: 2026
    to_year: present
  ui:
    preset: paper
    preset_menu:
    - paper
    - slate
    - ink
    - terminal
    theme_color: '#244b6e'
    typography: system
    dark_mode: true
    section_index: list
    sidebar_menu_foldable: true
    sidebar_menu_compact: false
    sidebar_expand_levels: 1
    sidebar_menu_truncate: 300
    sidebar_icon_policy: groups
    sidebar_headings: 2
    backlinks: true
    annotation: false
    footer_style: slim
menus:
  main:
  - identifier: book
    name: 阅读
    pageRef: /book/
    weight: 10
    params:
      icon: fa-solid fa-book-open
  - identifier: foundations
    parent: book
    name: 认识美国
    pageRef: /book/foundations/
    weight: 10
    params:
      icon: fa-solid fa-landmark
  - identifier: life
    parent: book
    name: 建立日常生活
    pageRef: /book/life/
    weight: 20
    params:
      icon: fa-solid fa-house
  - identifier: people
    parent: book
    name: 人生、健康与学习
    pageRef: /book/people/
    weight: 30
    params:
      icon: fa-solid fa-heart-pulse
  - identifier: work
    parent: book
    name: 工作与财务
    pageRef: /book/work/
    weight: 40
    params:
      icon: fa-solid fa-briefcase
  - identifier: rights
    parent: book
    name: 法律、风险与环境
    pageRef: /book/rights/
    weight: 50
    params:
      icon: fa-solid fa-scale-balanced
  - identifier: routes
    name: 事项
    pageRef: /docs/routes/
    weight: 20
    params:
      icon: fa-solid fa-list-check
  - identifier: regions
    name: 地区
    pageRef: /docs/regions/
    weight: 30
    params:
      icon: fa-solid fa-map-location-dot
