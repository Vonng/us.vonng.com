            - { label: 奥斯汀公校入学, page: /book/people/school/school-enrollment }
            - { label: STAR+PLUS 照护, page: /book/people/aging/caregiving-plan }
            - { label: 休斯敦水电开户, page: /book/life/household/utilities }
            - { label: OAG 消费投诉, page: /book/rights/contracts/reading-contracts }

  - type: guide-about
    partial: us/home/about.html
    key: about
    data:
      title: 关于本书
      desc: 用中文写成的美国社会与生活参考书，可以从头读，也可以按问题查。
      links:
        - { label: 阅读说明, page: /docs/about, icon: fa-solid fa-book-bookmark }
        - { label: 术语与文件, page: /docs/glossary, icon: fa-solid fa-language }
        - { label: 整书打印, url: /_print/book/, icon: fa-solid fa-print }
        - { label: GitHub 源码, url: "https://github.com/Vonng/us.vonng.com", external: true, icon: fa-brands fa-github }
      facts:
        - { label: 作者, text: "[冯若航](https://vonng.com/)" }
        - { label: 来源, text: 重要事实引用主管机构、法律、官方服务说明与原始表件。 }
        - { label: 核验, text: 正式主题由作者以外的参与者对照原文核验，页面注明核验日期。 }
        - { label: 覆盖, text: 州一级细节集中在加州、纽约州、华盛顿州与得州，按实际地址确认。 }
