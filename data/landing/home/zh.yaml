# 中文首页 landing 数据（《美利坚生活指南》）
# 由 content/_index.md（layout: landing, landing: home）引用；英文首页见同目录 en.yaml。
# 站点分区模板在 layouts/_partials/us/home/，设计语言与 ca.vonng.com、sg.vonng.com 首页一致：
# 部分与章节的链接、顺序取自真实分区（只列已有正文的章节），page 引用经 site.GetPage 校验，缺失时构建报错。
# 文案按“桌面一行、窄屏两行均衡”写，修改后在 1440 与 390 宽各看一遍，不要留孤字。

sections:
  - type: hero
    data:
      class: guide-home-hero
      title: 美利坚生活指南
      lead: 读懂美利坚社会，找到日常生活与人生事务的办事指南。
      note: 冯若航 编写 · 每篇注明适用范围与核验日期
      note_icon: fa-solid fa-pen-nib
      image:
        src: /images/us-life-hero.webp
        alt: 海湾步道、金门大桥与远山的美国生活主题插画
      media:
        ratio: 1fr 1.1fr
        max_width: 600px
      actions:
        - { label: 阅读全书, url: /book/, style: primary, icon: fa-solid fa-book-open }
        - { label: 按事项查, url: "#routes", style: ghost, icon: fa-solid fa-list-check }
        - { label: 按州查, url: "#regions", style: ghost, icon: fa-solid fa-map-location-dot }

  - type: guide-parts
    partial: us/home/parts.html
    key: contents
    data:
      title: 全书目录
      desc: 五个部分由背景到实务，每章都可以单独查用。
      more: { label: 三级目录, page: /book, anchor: contents }
      items:
        - page: /book/foundations
          icon: fa-solid fa-landmark
          desc: 地区差异、历史形成与联邦州地方分工。
          chapters:
            geography: { desc: 城乡通勤、气候时区与住址比较 }
            government: { desc: 联邦州县分工、公共参与与投票 }
            history: { desc: 国家形成、移民脉络与民权历史 }
            communities: { desc: 部落主权、土地与今天的共同体 }
            culture: { desc: 寒暄邀约、交往边界与社交默契 }
            world: { desc: 跨国家庭、海外联系与国际往来 }
        - page: /book/life
          icon: fa-solid fa-house
          desc: 身份文件、住房、出行、消费与社区日常。
          chapters:
            documents: { desc: 签证身份、SSN、返美与地址变更 }
            housing: { desc: 租房流程、押金结算与自住购房 }
            household: { desc: 水电燃气开户、日常购物与退货 }
            transport: { desc: 公共交通、驾照换领与买车保险 }
            digital: { desc: 手机套餐、家庭网络与通信补助 }
            community: { desc: 图书馆办卡、社区课程与活动 }
        - page: /book/people
          icon: fa-solid fa-heart-pulse
          desc: 医疗保险、婚育、学校、照护与养老。
          chapters:
            accessibility: { desc: 心理健康支持与无障碍便利申请 }
            health: { desc: 保险费用、预约网络与账单申诉 }
            family: { desc: 结婚离婚、孕产出生与托育安排 }
            education: { desc: 成人继续学习、选课与学费资助 }
            school: { desc: 公校入学、学区分配与在校支持 }
            language: { desc: 预约、查账与跟进的英语沟通 }
            aging: { desc: 退休与 Medicare、照护与身后事 }
        - page: /book/work
          icon: fa-solid fa-briefcase
          desc: 求职就业、劳动权益、银行信用与税务。
          chapters:
            career: { desc: 求职渠道、录用核对与入职文件 }
            employment: { desc: 工资加班、失业保险与职场权利 }
            finance: { desc: 银行付款、信用报告、债务与援助 }
            tax: { desc: 税务居民判定、年度报税与州税 }
            business: { desc: 个人接单、开店登记与停业结清 }
        - page: /book/rights
          icon: fa-solid fa-scale-balanced
          desc: 法律帮助、合同纠纷、应急安全与户外。
          chapters:
            legal: { desc: 寻找律师、法院通知与回应期限 }
            contracts: { desc: 消费合同签约、取消与投诉 }
            outdoors: { desc: 公园步道、营地规则与野外安全 }
            safety: { desc: 紧急求助、灾害准备与枪支安全 }

  - type: guide-routes
    partial: us/home/routes.html
    key: routes
    data:
      title: 按事项查
      desc: 按人生事件串起跨章主题，理清前置条件与办理顺序。
      more: { label: 全部事项, page: /docs/routes }
      columns: 5
      items:
        - { name: 抵达, desc: 住处、通信、账户与医疗, page: /docs/routes/arrival, icon: fa-solid fa-plane-arrival }
        - { name: 搬家, desc: 地址、驾照、医保与州税衔接, page: /docs/routes/moving, icon: fa-solid fa-truck-moving }
        - { name: 工作, desc: 求职、录用核对与入职文件, page: /docs/routes/start-work, icon: fa-solid fa-briefcase }
        - { name: 失业, desc: 最后工资、失业金与医保, page: /docs/routes/job-loss, icon: fa-solid fa-user-xmark }
        - { name: 看病, desc: 保险网络、预约与账单异议, page: /docs/routes/medical-care, icon: fa-solid fa-stethoscope }
        - { name: 报税, desc: 税务身份、材料与州税申报, page: /docs/routes/tax-preparation, icon: fa-solid fa-file-invoice-dollar }
        - { name: 生育, desc: 孕产保险、出生证明与加保, page: /docs/routes/parenthood, icon: fa-solid fa-baby-carriage }
        - { name: 照顾, desc: 照护评估、居家服务与授权, page: /docs/routes/caregiving, icon: fa-solid fa-hand-holding-heart }
        - { name: 退休, desc: 退休收入与 Medicare 登记, page: /docs/routes/retirement, icon: fa-solid fa-umbrella-beach }
        - { name: 丧亲, desc: 死亡证明、殡葬与遗属申领, page: /docs/routes/bereavement, icon: fa-solid fa-dove }

  # 四州覆盖深度一致（每州约 45 个本州分支入口），因此四州均为主卡；其余各州暂无地区页，不设缩写入口。
  - type: guide-regions
    partial: us/home/regions.html
    key: regions
    data:
      title: 按州查
      desc: 同一件事各州规则与机构不同，按实际居住的州进入当地入口。
      more: { label: 地区总览, page: /docs/regions }
      topics_label: 常用入口
      featured:
        - code: CA
          name: 加利福尼亚州
          desc: 洛杉矶、旧金山的租房、驾照、就业与入学入口。
          page: /docs/regions/california
          topics:
            - { label: 加州租房押金, page: /book/life/housing/ca-deposit }
            - { label: 租房申请与交房, page: /book/life/housing/rental-process }
            - { label: DMV 新居民驾照, page: /book/life/transport/new-resident-license }
            - { label: 每日加班与欠薪, page: /book/work/employment/pay-stub-overtime }
            - { label: EDD 失业申请, page: /book/work/employment/job-loss-support }
            - { label: Medi-Cal 孕产保障, page: /book/people/family/birth-and-first-weeks }
            - { label: IHSS 居家照护, page: /book/people/aging/caregiving-plan }
            - { label: 旧金山公校入学, page: /book/people/school/school-enrollment }
        - code: NY
          name: 纽约州
          desc: 纽约市的租房、驾照、就业、医保与入学入口。
          page: /docs/regions/new-york
          topics:
            - { label: 租房申请与押金, page: /book/life/housing/rental-process }
            - { label: DMV 新居民驾照, page: /book/life/transport/new-resident-license }
            - { label: 工资单与加班费, page: /book/work/employment/pay-stub-overtime }
            - { label: 失业金申请与听证, page: /book/work/employment/job-loss-support }
            - { label: 孕产投保与出生记录, page: /book/people/family/birth-and-first-weeks }
            - { label: 纽约市公校入学, page: /book/people/school/school-enrollment }
            - { label: 纽约市办证结婚, page: /book/people/family/marriage-separation }
            - { label: HIICAP 与 Medicare, page: /book/people/aging/retirement-medicare }
        - code: WA
          name: 华盛顿州
          desc: 西雅图的租房、驾照、就业、照护与入学入口。
          page: /docs/regions/washington
          topics:
            - { label: 租房申请与押金, page: /book/life/housing/rental-process }
            - { label: DOL 新居民驾照, page: /book/life/transport/new-resident-license }
            - { label: ESD 失业申请, page: /book/work/employment/job-loss-support }
            - { label: Apple Health 孕产, page: /book/people/family/birth-and-first-weeks }
            - { label: 西雅图公校入学, page: /book/people/school/school-enrollment }
            - { label: 西雅图紧急求助, page: /book/rights/safety/emergency-help }
            - { label: HCS 照护评估, page: /book/people/aging/caregiving-plan }
            - { label: WorkSource 求职, page: /book/work/career/job-search-onboarding }
        - code: TX
          name: 得克萨斯州
          desc: 奥斯汀、休斯敦的租房、驾照、就业与入学入口。
          page: /docs/regions/texas
          topics:
            - { label: 租房申请与押金, page: /book/life/housing/rental-process }
            - { label: DPS 新居民驾照, page: /book/life/transport/new-resident-license }
            - { label: TWC 失业申请, page: /book/work/employment/job-loss-support }
