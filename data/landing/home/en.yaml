        - code: TX
          name: Texas
          desc: Renting, driving, work and school in Austin and Houston.
          page: /docs/regions/texas
          topics:
            - { label: Applications and deposits, page: /book/life/housing/rental-process }
            - { label: DPS license for newcomers, page: /book/life/transport/new-resident-license }
            - { label: TWC unemployment claims, page: /book/work/employment/job-loss-support }
            - { label: "Medicaid, CHIP and pregnancy", page: /book/people/family/birth-and-first-weeks }
            - { label: Austin public schools, page: /book/people/school/school-enrollment }
            - { label: STAR+PLUS care, page: /book/people/aging/caregiving-plan }
