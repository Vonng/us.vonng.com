            - { label: Applications and deposits, page: /book/life/housing/rental-process }
            - { label: DMV license for newcomers, page: /book/life/transport/new-resident-license }
            - { label: Pay stubs and overtime, page: /book/work/employment/pay-stub-overtime }
            - { label: Unemployment and hearings, page: /book/work/employment/job-loss-support }
            - { label: Pregnancy and birth records, page: /book/people/family/birth-and-first-weeks }
            - { label: NYC public schools, page: /book/people/school/school-enrollment }
            - { label: Getting married in NYC, page: /book/people/family/marriage-separation }
            - { label: HIICAP and Medicare, page: /book/people/aging/retirement-medicare }
        - code: WA
          name: Washington
          desc: Renting, driving, work, care and school in Seattle.
          page: /docs/regions/washington
          topics:
            - { label: Applications and deposits, page: /book/life/housing/rental-process }
            - { label: DOL license for newcomers, page: /book/life/transport/new-resident-license }
            - { label: ESD unemployment claims, page: /book/work/employment/job-loss-support }
            - { label: Apple Health in pregnancy, page: /book/people/family/birth-and-first-weeks }
            - { label: Seattle public schools, page: /book/people/school/school-enrollment }
            - { label: Emergency help in Seattle, page: /book/rights/safety/emergency-help }
