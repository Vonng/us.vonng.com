            - { label: Complaints to the OAG, page: /book/rights/contracts/reading-contracts }

  - type: guide-about
    partial: us/home/about.html
    key: about
    data:
      title: About this guide
      desc: A reference to American society and daily life, written in Chinese. Read it through, or look up one question.
      links:
        - { label: Reading notes, page: /docs/about, icon: fa-solid fa-book-bookmark }
        - { label: Glossary, page: /docs/glossary, icon: fa-solid fa-language }
        - { label: Print edition, url: /_print/book/, icon: fa-solid fa-print }
        - { label: GitHub, url: "https://github.com/Vonng/us.vonng.com", external: true, icon: fa-brands fa-github }
      facts:
        - { label: Language, text: "Simplified Chinese, keeping the English terms used on forms and notices." }
        - { label: Sources, text: "Key facts cite agencies, statutes, official guidance and original forms." }
        - { label: Checks, text: "Topics are checked against their sources by someone other than the author, and dated." }
        - { label: Coverage, text: "State-level detail covers California, New York, Washington and Texas." }
