    partial: us/home/regions.html
    key: regions
    data:
      title: By state
      desc: Rules and agencies differ by state, so start from where you actually live.
      more: { label: All regions, page: /docs/regions }
      topics_label: " common topics"
      featured:
        - code: CA
          name: California
          desc: Renting, driving, work and school in Los Angeles and San Francisco.
          page: /docs/regions/california
          topics:
            - { label: Security deposits in CA, page: /book/life/housing/ca-deposit }
            - { label: Applying and moving in, page: /book/life/housing/rental-process }
            - { label: DMV license for newcomers, page: /book/life/transport/new-resident-license }
            - { label: Overtime and unpaid wages, page: /book/work/employment/pay-stub-overtime }
            - { label: EDD unemployment claims, page: /book/work/employment/job-loss-support }
            - { label: Medi-Cal in pregnancy, page: /book/people/family/birth-and-first-weeks }
            - { label: IHSS in-home care, page: /book/people/aging/caregiving-plan }
            - { label: San Francisco schools, page: /book/people/school/school-enrollment }
        - code: NY
