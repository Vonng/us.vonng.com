# English home landing data (Life in America).
# Used by content/_index.en.md (layout: landing, landing: home). The guide itself is
# written in Chinese only: every entry here links to the Chinese page (hreflang zh-CN),
# and the page says so once in the hero and once per section rather than on every card.
# Hero and footer links run through Hugo's relLangURL, so Chinese targets are written
# as ../book/ (resolves to /book/); the site partials resolve `page:` in the zh site.

sections:
  - type: hero
    data:
      class: guide-home-hero
      title: Life in America
      lead: Understand how the United States works and find your way through everyday life, from documents and housing to health insurance, work and taxes.
      note: The guide is written in Simplified Chinese; this page maps it in English.
      note_icon: fa-solid fa-language
      image:
        src: /images/us-life-hero.webp
        alt: Illustration of a bayside path with the Golden Gate Bridge and distant hills
      media:
        ratio: 1fr 1.1fr
        max_width: 600px
      actions:
        - { label: Read in Chinese, url: ../book/, style: primary, icon: fa-solid fa-book-open }
        - { label: By task, url: "#routes", style: ghost, icon: fa-solid fa-list-check }
        - { label: By state, url: "#regions", style: ghost, icon: fa-solid fa-map-location-dot }

  - type: guide-parts
    partial: us/home/parts.html
    key: contents
    data:
      title: Contents
      desc: Five parts, from background to practice. Each chapter stands on its own and opens in Chinese.
      more: { label: Full contents, page: /book, anchor: contents }
      items:
        - page: /book/foundations
          icon: fa-solid fa-landmark
          title: Understanding America
          desc: Regional differences, history and who governs what.
          chapters:
            geography: { title: "Regions and places to live", desc: "Commutes, climate, time zones and comparing places" }
            government: { title: "Government and public affairs", desc: "Federal, state and county roles; voting and taking part" }
            history: { title: "History and how society formed", desc: "Nation-building, immigration and civil rights" }
            communities: { title: "Native nations and communities", desc: "Tribal sovereignty, land and communities today" }
            culture: { title: "Social life and everyday culture", desc: "Small talk, invitations, boundaries and social cues" }
            world: { title: "America and the world", desc: "Transnational families and ties abroad" }
        - page: /book/life
          icon: fa-solid fa-house
          title: Setting up daily life
          desc: Documents, housing, getting around, shopping and community.
          chapters:
            documents: { title: "Status and documents", desc: "Visa status, SSN, re-entry and changing address" }
            housing: { title: "Housing: renting and buying", desc: "Renting, deposits and buying a home to live in" }
            household: { title: "Household services", desc: "Utilities, everyday shopping and returns" }
            transport: { title: "Getting around, driving and cars", desc: "Transit, license transfer, buying and insuring a car" }
            digital: { title: "Phones, accounts and digital life", desc: "Phone plans, home internet and connectivity aid" }
            community: { title: "Libraries, events and community services", desc: "Library cards, community classes and events" }
        - page: /book/people
          icon: fa-solid fa-heart-pulse
          title: Health, family and learning
          desc: Health insurance, family, school, care and later life.
          chapters:
            accessibility: { title: "Mental health, disability and access", desc: "Mental health support and asking for accommodations" }
            health: { title: "Health care and insurance", desc: "Premiums, networks, appointments and billing disputes" }
            family: { title: "Marriage, family and a new baby", desc: "Marriage, divorce, pregnancy, birth and child care" }
            education: { title: "Higher and continuing education", desc: "Adult learning, choosing courses and paying tuition" }
            school: { title: "Children and school", desc: "Public school enrollment, assignment and support" }
            language: { title: "American English and other languages", desc: "English for appointments, bills and follow-ups" }
            aging: { title: "Retirement, care and after a death", desc: "Retirement, Medicare, care and end-of-life matters" }
        - page: /book/work
          icon: fa-solid fa-briefcase
          title: Work and money
          desc: Jobs, workplace rights, banking, credit and tax.
          chapters:
            career: { title: "Finding and starting a job", desc: "Job search, checking offers and onboarding forms" }
            employment: { title: "Employment rights and benefits", desc: "Wages, overtime, unemployment and workplace rights" }
            finance: { title: "Banking, credit and money", desc: "Bank accounts, credit reports, debt and assistance" }
            tax: { title: "Taxes and filing", desc: "Tax residency, annual returns and state taxes" }
            business: { title: "Starting a business", desc: "Freelancing, registering a business and closing it" }
        - page: /book/rights
          icon: fa-solid fa-scale-balanced
          title: Law, risk and the outdoors
          desc: Legal help, contracts, emergencies and the outdoors.
          chapters:
            legal: { title: "Legal help and solving problems", desc: "Finding a lawyer, court notices and deadlines" }
            contracts: { title: "Contracts", desc: "Consumer contracts, cancelling and complaints" }
            outdoors: { title: "Nature and the outdoors", desc: "Parks, trails, campgrounds and staying safe" }
            safety: { title: "Safety and emergencies", desc: "Emergency help, disaster readiness and gun safety" }

  - type: guide-routes
    partial: us/home/routes.html
    key: routes
    data:
      title: By task
      desc: Each path gathers topics from across the book and sets out what to settle first.
      more: { label: All tasks, page: /docs/routes }
      columns: 2
      layout: rows
      items:
        - { name: Arrival, desc: "Housing, phone, bank accounts and health care", page: /docs/routes/arrival, icon: fa-solid fa-plane-arrival }
        - { name: Moving, desc: "Address, license, health coverage and state tax", page: /docs/routes/moving, icon: fa-solid fa-truck-moving }
        - { name: New job, desc: "Job search, checking the offer and onboarding forms", page: /docs/routes/start-work, icon: fa-solid fa-briefcase }
        - { name: Job loss, desc: "Final pay, unemployment benefits and health coverage", page: /docs/routes/job-loss, icon: fa-solid fa-user-xmark }
        - { name: Medical care, desc: "Insurance networks, appointments and disputing bills", page: /docs/routes/medical-care, icon: fa-solid fa-stethoscope }
        - { name: Taxes, desc: "Filing status, documents and state returns", page: /docs/routes/tax-preparation, icon: fa-solid fa-file-invoice-dollar }
        - { name: New baby, desc: "Pregnancy coverage, birth certificate and adding to a plan", page: /docs/routes/parenthood, icon: fa-solid fa-baby-carriage }
        - { name: Caregiving, desc: "Care assessments, home services and legal authority", page: /docs/routes/caregiving, icon: fa-solid fa-hand-holding-heart }
        - { name: Retirement, desc: "Retirement income and Medicare enrollment", page: /docs/routes/retirement, icon: fa-solid fa-umbrella-beach }
        - { name: Bereavement, desc: "Death certificates, funerals and survivor benefits", page: /docs/routes/bereavement, icon: fa-solid fa-dove }

